name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make durable
      - run: make race

  native-darwin-arm64-release-candidate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require supported native architecture
        run: test "$(uname -s)/$(uname -m)" = "Darwin/arm64"
      - run: make release-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memoryd-${{ github.sha }}-darwin-arm64
          path: |
            dist/memoryd-darwin-arm64
            dist/memoryd-darwin-arm64.manifest.json
            dist/memoryd-darwin-arm64.sha256
          if-no-files-found: error
          retention-days: 14
